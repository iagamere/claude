name: Build PS4Monitor APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate the Gradle project
        shell: bash
        run: |
          S=$(find . -name settings.gradle.kts -not -path '*/node_modules/*' | head -1)
          test -n "$S" || { echo "settings.gradle.kts not found"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Stage APK for upload
        if: success()
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "APK missing or empty: $APK"; find app/build/outputs -maxdepth 6 -type f -print 2>/dev/null || true; exit 1; }
          mkdir -p "$RUNNER_TEMP/ps4monitor-download"
          cp "$APK" "$RUNNER_TEMP/ps4monitor-download/PS4Monitor-debug.apk"
          ls -lh "$RUNNER_TEMP/ps4monitor-download/PS4Monitor-debug.apk"

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PS4Monitor-APK
          path: ${{ runner.temp }}/ps4monitor-download/PS4Monitor-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        if: success()
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PS4Monitor-build-logs
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/test.log
          if-no-files-found: warn
          retention-days: 14
